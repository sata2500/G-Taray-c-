# Sürüm numarası (app/build.gradle.kts içindeki versionName) değiştiğinde uygulamayı derler,
# kalıcı anahtarla imzalar ve GitHub Releases'a yükler. Uygulama içi güncelleme bu sürümleri kullanır.
#
# Gerekli depo gizli değişkenleri (Settings → Secrets and variables → Actions):
#   GT_KEYSTORE_BASE64    kalıcı anahtar deposunun (gtarayici-release.p12) base64 hali
#   GT_KEYSTORE_PASSWORD  anahtar deposu parolası
name: Sürüm yayınla

on:
  push:
    paths:
      - app/build.gradle.kts
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NDK_VERSION: 29.0.14206865
      BUILD_TOOLS: 37.0.0
    steps:
      - uses: actions/checkout@v7

      - name: Sürümü ve anahtarı denetle
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.GT_KEYSTORE_BASE64 != '' && secrets.GT_KEYSTORE_PASSWORD != '' }}
        run: |
          version="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version zaten yayınlanmış; atlanıyor." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_KEY" != "true" ]; then
            echo "İmza anahtarı gizli değişkenleri tanımlı değil (GT_KEYSTORE_BASE64, GT_KEYSTORE_PASSWORD); atlanıyor." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v6
        if: steps.check.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-go@v7
        if: steps.check.outputs.build == 'true'
        with:
          go-version-file: native/ovpn-bridge/go.mod
          cache-dependency-path: native/ovpn-bridge/go.sum

      - name: Android SDK bileşenleri
        if: steps.check.outputs.build == 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.2" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION" >/dev/null

      # sing-box ve OpenVPN derlemesi uzun sürer; betikler değişmedikçe önbellekten alınır.
      - name: Yerel kütüphane önbelleği
        if: steps.check.outputs.build == 'true'
        id: native-cache
        uses: actions/cache@v6
        with:
          path: |
            vpn-core/src/main/jniLibs/*/libsingbox.so
            vpn-core/src/main/jniLibs/*/libopenvpn.so
            vpn-core/src/main/jniLibs/*/libovpnbridge.so
          key: native-${{ hashFiles('scripts/build-singbox.sh', 'scripts/build-openvpn.sh', 'native/**') }}

      - name: Yerel kütüphaneleri derle (sing-box, OpenVPN)
        if: steps.check.outputs.build == 'true' && steps.native-cache.outputs.cache-hit != 'true'
        run: |
          scripts/build-singbox.sh
          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION" scripts/build-openvpn.sh

      - uses: gradle/actions/setup-gradle@v6
        if: steps.check.outputs.build == 'true'

      - name: Derle ve test et
        if: steps.check.outputs.build == 'true'
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease :vpn-core:assembleRelease

      - name: İmzala
        if: steps.check.outputs.build == 'true'
        env:
          GT_KEYSTORE_BASE64: ${{ secrets.GT_KEYSTORE_BASE64 }}
          GT_KEYSTORE_PASSWORD: ${{ secrets.GT_KEYSTORE_PASSWORD }}
        run: |
          echo "$GT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          GT_KEYSTORE_FILE="$RUNNER_TEMP/release.p12" scripts/sign-release.sh dist
          rm -f "$RUNNER_TEMP/release.p12"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Yayınla
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "G-Tarayıcı $VERSION" \
            --notes-file .github/release-notes.md \
            --latest
